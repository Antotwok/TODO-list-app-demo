<div class="container">

  <h1>My TODO List</h1>

  <div class="view-toggle">

    <button
      [class.active]="view === 'list'"
      (click)="setView('list')"
    >
      List
    </button>

    <button
      [class.active]="view === 'calendar'"
      (click)="setView('calendar')"
    >
      Calendar
    </button>

  </div>

  <div class="todo-input">

    <input
      type="text"
      [(ngModel)]="newTodo"
      placeholder="What needs to be done?"
      (keyup.enter)="addTodo()"
    />

    <input
      type="date"
      [(ngModel)]="newDueDate"
      aria-label="Due date"
    />

    <button (click)="addTodo()">
      Add Task
    </button>

  </div>

  @if (view === 'list') {

    <div class="todo-filters">

      <button
        [class.active]="filter === 'all'"
        (click)="setFilter('all')"
      >
        All
      </button>

      <button
        [class.active]="filter === 'active'"
        (click)="setFilter('active')"
      >
        Active
      </button>

      <button
        [class.active]="filter === 'completed'"
        (click)="setFilter('completed')"
      >
        Completed
      </button>

    </div>

    <div class="todo-list">

      @for (todo of filteredTodos; track todo.id) {

        <div class="todo-item">

          <span [class.completed]="todo.completed">
            {{ todo.title }}
          </span>

          <input
            type="date"
            class="due-date-input"
            [ngModel]="todo.dueDate"
            (ngModelChange)="updateDueDate(todo, $event)"
            aria-label="Due date"
          />

          <button
            class="complete-btn"
            [class.active]="todo.completed"
            (click)="toggleTodo(todo)"
          >
            {{ todo.completed ? 'Completed' : 'Complete' }}
          </button>

          <button (click)="deleteTodo(todo)">
            Delete
          </button>

        </div>

      }

    </div>

  } @else {

    <app-todo-calendar
      [todos]="todos"
      (toggleTodo)="toggleTodo($event)"
      (deleteTodo)="deleteTodo($event)"
    />

  }

</div>
